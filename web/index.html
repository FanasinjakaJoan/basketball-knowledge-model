<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Basketball Knowledge Model — explorer</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2c;
    --panel-2: #1d2637;
    --line: #2a3548;
    --text: #e6ecf5;
    --muted: #94a3b8;
    --accent: #5ac8fa;
    --accent-2: #ffb454;
    --good: #5ddb92;
    --bad: #ff7a7a;
    --off: #6ea8fe;
    --def: #ff9db1;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 18px; background: linear-gradient(90deg, #16213a, #101725);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; font-size: 11px; color: var(--muted);
  }
  .badge b { color: var(--text); font-weight: 600; }
  .search { flex: 1 1 320px; display: flex; gap: 8px; min-width: 260px; }
  input[type=text], select {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%;
  }
  input[type=text]:focus, select:focus { outline: 2px solid rgba(90,200,250,.35); border-color: var(--accent); }
  button {
    background: var(--accent); color: #06222e; border: 0; border-radius: 8px;
    padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .lang { display: flex; gap: 4px; }
  .langbtn { padding: 4px 9px; font-size: 11px; border-radius: 6px; color: var(--muted); }
  .langbtn.active { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 0; height: calc(100vh - 61px); }
  aside {
    border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px;
  }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .chip {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; margin: 0 6px 6px 0; font-size: 12px; cursor: pointer; color: var(--text);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .item {
    text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 6px 8px; cursor: pointer; color: var(--text); font-size: 12.5px; line-height: 1.35;
  }
  .item:hover { background: var(--panel-2); border-color: var(--line); }
  .item .t { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  section.content { overflow: auto; padding: 16px 18px 60px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 6px 6px 0 0;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(90,200,250,.07); }
  .tab:hover { color: var(--text); }
  .panel { display: none; }
  .panel.active { display: block; }
  .summary { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .meta code { color: var(--accent-2); font-family: var(--mono); }
  .evidence { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 0 0 12px; padding-left: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; }
  td.wrap { max-width: 340px; }
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card .kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); }
  .card p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
  .kv { margin-top: 8px; display: grid; grid-template-columns: 92px 1fr; gap: 2px 8px; font-size: 12px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .kv div:nth-child(even) { color: var(--text); }
  pre {
    background: #0b1018; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.45; margin: 0;
  }
  pre.court { font-size: 12px; line-height: 1.05; }
  .graphwrap { position: relative; background: #0b1018; border: 1px solid var(--line); border-radius: 10px; height: 62vh; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg text { font-size: 9.5px; fill: var(--muted); pointer-events: none; }
  svg line { stroke: #33415c; stroke-width: .8; transition: opacity .15s; }
  svg line.dim { opacity: .05; }
  svg circle { cursor: pointer; stroke: #0b1018; stroke-width: 1.2; }
  svg g.node { transition: opacity .15s; cursor: grab; }
  svg g.node.dim { opacity: .1; }
  svg text { transition: opacity .15s; }
  .graphbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  button.fam {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; color: var(--muted); font-size: 11px; cursor: pointer; font-weight: 400;
  }
  button.fam:hover { border-color: var(--accent); color: var(--accent); }
  button.fam.on { border-color: var(--accent); color: var(--accent); background: rgba(90,200,250,.08); }
  .gbtn { padding: 4px 11px; font-size: 13px; line-height: 1.2; }
  .graphhint { color: var(--muted); font-size: 11.5px; margin: 0 0 8px; }
  .gsearch { position: relative; }
  .gsearch input { width: 200px; }
  .gsearch-list {
    position: absolute; top: 36px; left: 0; min-width: 260px; max-height: 280px; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; z-index: 40; display: none;
  }
  .gsearch-list button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    color: var(--text); padding: 6px 10px; font-size: 12px; border-radius: 0; font-weight: 400;
  }
  .gsearch-list button:hover { background: var(--panel-2); }
  .gsearch-list .t { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-right: 6px; }
  .drawer {
    position: fixed; top: 61px; right: 0; width: min(430px, 92vw); height: calc(100vh - 61px);
    background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow: auto; z-index: 30;
    transform: translateX(100%); transition: transform .18s ease;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h3 { margin: 0 0 2px; font-size: 16px; }
  .drawer .close { position: absolute; top: 12px; right: 12px; }
  .rel { margin-top: 12px; }
  .rel h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .pill {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 11.5px;
  }
  .pill b { color: var(--accent); font-weight: 500; }
  .keys { margin: 8px 0 0; padding-left: 16px; color: var(--muted); font-size: 12.5px; }
  .keys li { margin-bottom: 3px; }
  .empty { color: var(--muted); padding: 24px 0; }
  .err { color: var(--bad); }
  .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Basketball Knowledge Model <span data-i18n="nav.tag">· explorer</span></h1>
  <div class="badges" id="badges"></div>
  <div class="lang">
    <button class="ghost langbtn" data-lang="en" title="English">EN</button>
    <button class="ghost langbtn" data-lang="fr" title="Français">FR</button>
    <button class="ghost langbtn" data-lang="mg" title="Malagasy">MG</button>
  </div>
  <div class="search">
    <input id="q" type="text" data-i18n-ph="ask.placeholder" placeholder="Ask: how do you attack a 2-3 zone?" autocomplete="off" />
    <button id="ask" data-i18n="ask.button">Ask</button>
  </div>
</header>

<main>
  <aside>
    <h2 data-i18n="aside.examples">Example questions</h2>
    <div id="examples"></div>
    <h2 data-i18n="aside.browse">Browse</h2>
    <div class="flex" style="margin-bottom:8px">
      <select id="typeFilter" style="flex:1"></select>
    </div>
    <input id="filter" type="text" data-i18n-ph="browse.placeholder" placeholder="filter by name…" />
    <div class="list" id="browse" style="margin-top:8px"></div>
    <h2 data-i18n="aside.court">Court</h2>
    <div id="schemes" style="margin-bottom:8px"></div>
    <h2 data-i18n="aside.plays">Play graphs</h2>
    <div id="plays"></div>
  </aside>

  <section class="content">
    <div class="tabs">
      <button class="tab active" data-tab="answer" data-i18n="tab.answer">Answer</button>
      <button class="tab" data-tab="plan" data-i18n="tab.plan">Query plan</button>
      <button class="tab" data-tab="sparql">SPARQL</button>
      <button class="tab" data-tab="cypher">Cypher</button>
      <button class="tab" data-tab="graph" data-i18n="tab.graph">Graph</button>
      <button class="tab" data-tab="court" data-i18n="tab.court">Court</button>
    </div>

    <div class="panel active" id="panel-answer">
      <p class="summary" id="summary" data-i18n="answer.empty">Ask a question, or pick one on the left.</p>
      <div class="meta" id="meta"></div>
      <ul class="evidence" id="evidence"></ul>
      <div id="results"></div>
    </div>
    <div class="panel" id="panel-plan"><pre id="planOut">—</pre></div>
    <div class="panel" id="panel-sparql"><pre id="sparqlOut">—</pre></div>
    <div class="panel" id="panel-cypher"><pre id="cypherOut">—</pre></div>
    <div class="panel" id="panel-graph">
      <div class="graphbar">
        <button class="ghost gbtn" id="gBack" data-i18n="graph.back" hidden>&larr; back</button>
        <select id="graphFocus" style="max-width:280px"></select>
        <select id="graphDepth">
          <option value="1" data-i18n="depth.1">depth 1</option>
          <option value="2" data-i18n="depth.2">depth 2</option>
          <option value="3" data-i18n="depth.3">depth 3</option>
        </select>
        <div class="gsearch">
          <input id="graphSearch" type="text" data-i18n-ph="graph.search" placeholder="find a node&hellip;" autocomplete="off" />
          <div class="gsearch-list" id="graphSearchList"></div>
        </div>
        <button class="ghost gbtn" id="gzIn" title="zoom in">+</button>
        <button class="ghost gbtn" id="gzOut" title="zoom out">&minus;</button>
        <button class="ghost gbtn" id="gFit" data-i18n="graph.fit">fit</button>
        <button class="ghost gbtn" id="gReset" data-i18n="graph.reset">reset</button>
        <select id="graphLabels">
          <option value="auto" data-i18n="graph.labels.auto">labels: auto</option>
          <option value="on" data-i18n="graph.labels.on">labels: all</option>
          <option value="off" data-i18n="graph.labels.off">labels: none</option>
        </select>
        <span id="graphInfo"></span>
      </div>
      <p class="graphhint" data-i18n="graph.hint"></p>
      <div class="graphwrap"><svg id="svg"></svg></div>
      <div class="legend" id="graphLegend"></div>
    </div>
    <div class="panel" id="panel-court">
      <div class="graphbar"><select id="courtScheme" style="max-width:320px"></select></div>
      <pre class="court" id="courtOut">—</pre>
    </div>
  </section>
</main>

<div class="drawer" id="drawer">
  <button class="ghost close" data-i18n="drawer.close" onclick="closeDrawer()">close</button>
  <div id="drawerBody"></div>
</div>

<script>
const state = { rows: [], intent: null, focus: null, nodes: [], links: [], scheme: null };

const TYPE_COLORS = {
  Play: '#ff7a7a', OffensivePlay: '#ff7a7a', DefensivePlay: '#ff9db1',
  Action: '#6ea8fe', ActionType: '#a8c7ff', Decision: '#ffb454', Assignment: '#ff9db1',
  Zone: '#5ddb92', ZoneType: '#9be7bd',
  Scheme: '#c792ea', OffensiveScheme: '#c792ea', DefensiveScheme: '#e1a3ff',
  Coverage: '#ffb454', Formation: '#e6ecf5', Counter: '#ff6f91', Outcome: '#7fdbca',
  Situation: '#8fa6c4', Rule: '#ffe066', RuleType: '#ffe066', Penalty: '#ffd6a5',
  Position: '#5ac8fa', PositionGroup: '#9be3ff', Role: '#7fdbca', Archetype: '#5ddb92',
  Skill: '#e6ecf5', Player: '#5ac8fa', Coach: '#5ac8fa', Team: '#e6ecf5', Concept: '#94a3b8'
};
const colorOf = t => TYPE_COLORS[t] || '#94a3b8';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* --------------------------------------------------- i18n: interface chrome */
/* UI navigation only. Basketball & graph terminology ("pick and roll", "drop
   coverage", "scheme", "nodes", "edges", intent names, dataset content…)
   deliberately stays in English in every language. Kept in strict-JSON syntax
   so tests can parse it and verify that all languages define the same keys. */
const I18N = {
  "en": {
    "nav.tag": "· explorer",
    "ask.placeholder": "Ask: how do you attack a 2-3 zone?",
    "ask.button": "Ask",
    "aside.examples": "Example questions",
    "aside.browse": "Browse",
    "browse.placeholder": "filter by name…",
    "browse.allTypes": "all types",
    "aside.court": "Court",
    "aside.plays": "Play graphs",
    "tab.answer": "Answer",

    "tab.graph": "Graph",
    "tab.court": "Court",

    "drawer.incoming": "Incoming",

    "results.open": "open",
    "browse.nothing": "nothing found",
    "meta.confidence": "confidence",
    "meta.rows": "row(s)",
    "graph.search": "find a node in the graph\u2026",
    "graph.hint": "Drag nodes to rearrange \u00b7 scroll to zoom \u00b7 double-click a node to explore around it \u00b7 click for details",
    "graph.fit": "fit",
    "graph.reset": "reset",
    "graph.back": "\u2190 back",
    "graph.labels.auto": "labels: auto",
    "graph.labels.on": "labels: all",
    "graph.labels.off": "labels: none"
  },
  "fr": {
    "nav.tag": "· explorateur",
    "ask.placeholder": "Posez une question : how do you attack a 2-3 zone?",
    "ask.button": "Demander",
    "aside.examples": "Exemples de questions",
    "aside.browse": "Parcourir",
    "browse.placeholder": "filtrer par nom…",
    "browse.allTypes": "tous les types",
    "aside.court": "Terrain",
    "aside.plays": "Graphes de plays",
    "tab.answer": "Réponse",
    "tab.plan": "Plan de requête",
    "tab.graph": "Graphe",
    "tab.court": "Terrain",
    "answer.empty": "Posez une question, ou choisissez-en une à gauche.",
    "depth.1": "profondeur 1",
    "depth.2": "profondeur 2",
    "depth.3": "profondeur 3",

    "scheme.none": "— sans scheme —",
    "drawer.close": "fermer",
    "drawer.incoming": "Entrants",
    "results.none": "Aucun résultat.",
    "results.open": "ouvrir",
    "browse.nothing": "aucun résultat",
    "meta.confidence": "confiance",
    "meta.rows": "ligne(s)",
    "graph.search": "trouver un node dans le graphe\u2026",
    "graph.hint": "Faites glisser les nodes pour les d\u00e9placer \u00b7 molette pour zoomer \u00b7 double-cliquez sur un node pour explorer autour \u00b7 cliquez pour les d\u00e9tails",
    "graph.fit": "ajuster",
    "graph.reset": "r\u00e9initialiser",
    "graph.back": "\u2190 retour",
    "graph.labels.auto": "\u00e9tiquettes : auto",
    "graph.labels.on": "\u00e9tiquettes : toutes",
    "graph.labels.off": "\u00e9tiquettes : aucune"
  },
  "mg": {
    "nav.tag": "· mpitsidika",
    "ask.placeholder": "Manontania: how do you attack a 2-3 zone?",
    "ask.button": "Manontania",
    "aside.examples": "Fanontaniana ohatra",
    "aside.browse": "Fikarohana",
    "browse.placeholder": "sivana araka ny anarana…",
    "browse.allTypes": "karazana rehetra",
    "aside.court": "Kianja",
    "aside.plays": "Play graphs",
    "tab.answer": "Valiny",
    "tab.plan": "Drafitra fanontaniana",
    "tab.graph": "Graph",
    "tab.court": "Kianja",
    "answer.empty": "Manontania fanontaniana, na safidio ny iray eo ankavia.",
    "depth.1": "halalina 1",
    "depth.2": "halalina 2",
    "depth.3": "halalina 3",
    "graph.whole": "— graph manontolo (220 fara-taminy) —",
    "scheme.none": "— tsy misy scheme —",
    "drawer.close": "akatona",
    "drawer.incoming": "Miditra",
    "results.none": "Tsy misy valiny.",
    "results.open": "sokafy",
    "browse.nothing": "tsy nisy hita",
    "meta.confidence": "fahatokisana",
    "meta.rows": "valiny",
    "graph.search": "hikaroka node ao amin'ny graph\u2026",
    "graph.hint": "Sarioso ny nodes hanitsiana \u00b7 kitihina hamitatra \u00b7 tsindrio indroa ny node hijerena ny manodidina azy \u00b7 tsindrio iray hahitana ny antsipiriany",
    "graph.fit": "hifanaraka",
    "graph.reset": "averina",
    "graph.back": "\u2190 miverina",
    "graph.labels.auto": "anarana: mandeha-ho azy",
    "graph.labels.on": "anarana: rehetra",
    "graph.labels.off": "anarana: tsy misy"
  }
};

let LANG = "en";
try {
  const saved = localStorage.getItem("bkg.lang");
  const nav = (navigator.language || "").toLowerCase();
  LANG = saved && I18N[saved] ? saved
    : nav.startsWith("fr") ? "fr"
    : nav.startsWith("mg") ? "mg" : "en";
} catch (e) { /* private mode etc. */ }

const t = key => (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll(".langbtn").forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));
  if (!state.intent) $("summary").textContent = t("answer.empty");
  if (state.examples) fillSelects();
  // re-fetch the server-generated explanations in the new language
  if (state.lastQuestion) run(state.lastQuestion, true).catch(() => {});
  if ($("panel-court").classList.contains("active")) loadCourt();
}
function setLang(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  try { localStorage.setItem("bkg.lang", lang); } catch (e) { /* ignore */ }
  applyLang();
}
document.querySelectorAll(".langbtn").forEach(b => b.onclick = () => setLang(b.dataset.lang));
applyLang();

/* ------------------------------------------------------------------ chrome */
async function boot() {
  const stats = await (await fetch('/api/stats')).json();
  state.stats = stats;
  $('badges').innerHTML = [
    ['nodes', stats.nodes], ['edges', stats.edges], ['datasets', stats.datasets.length],
    ['types', Object.keys(stats.node_types).length]
  ].map(([k, v]) => `<span class="badge">${k} <b>${v}</b></span>`).join('');

  const ex = await (await fetch('/api/examples')).json();
  state.examples = ex;
  $('examples').innerHTML = ex.questions.map(q => `<span class="chip">${esc(q)}</span>`).join('');
  $('examples').onclick = e => { if (e.target.classList.contains('chip')) run(e.target.textContent); };

  $('schemes').onclick = e => {
    if (!e.target.dataset.scheme) return;
    state.scheme = e.target.dataset.scheme || null;
    showTab('court'); loadCourt();
  };

  $('plays').innerHTML = ex.plays.map(p => `<span class="chip" data-play="${esc(p.id)}">${esc(p.label)}</span>`).join('');
  $('plays').onclick = e => {
    if (!e.target.dataset.play) return;
    state.focus = e.target.dataset.play;
    showTab('graph'); loadGraph();
  };

  fillSelects();
  browse();
  loadGraph();
  loadCourt();
}

/* Lang-dependent parts of the selects/chips; re-run on every language switch.
   "scheme", play/coverage labels etc. are technical terms and stay in English. */
function fillSelects() {
  const ex = state.examples, st = state.stats;
  if (!ex || !st) return;
  const focusVal = $('graphFocus').value || state.focus || '';
  $('graphFocus').innerHTML = ex.plays.concat([{id:'scheme:zone-2-3', label:'Zone 2-3 (scheme)'},
      {id:'coverage:drop', label:'Drop coverage'}, {id:'arch:rim-protector', label:'Rim protector'}])
    .map(p => `<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('') +
    `<option value="">${esc(t('graph.whole'))}</option>`;
  if (state.customFocus) ensureFocusOption(state.customFocus.id, state.customFocus.label);
  $('graphFocus').value = focusVal;

  const schemeVal = $('courtScheme').value || state.scheme || '';
  $('courtScheme').innerHTML = [{id:'', label:t('scheme.none')}, ...ex.schemes]
    .map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('');
  $('courtScheme').value = schemeVal;

  const typeVal = $('typeFilter').value;
  $('typeFilter').innerHTML = `<option value="">${esc(t('browse.allTypes'))}</option>` +
    st.types.map(ty => `<option value="${esc(ty)}">${esc(ty)}</option>`).join('');
  $('typeFilter').value = typeVal;

  $('schemes').innerHTML = [{id:'', label:t('scheme.none')}, ...ex.schemes]
    .map(s => `<span class="chip" data-scheme="${esc(s.id)}">${esc(s.label)}</span>`).join('');
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'graph' && !state.nodes.length) loadGraph();
  if (name === 'court') loadCourt();
}

/* ------------------------------------------------------------------- query */
async function run(question, keepTab) {
  $('q').value = question;
  const data = await (await fetch('/api/ask?q=' + encodeURIComponent(question) + '&lang=' + encodeURIComponent(LANG))).json();
  state.rows = data.rows || []; state.intent = data.intent; state.lastQuestion = question;
  $('summary').textContent = data.summary || data.error || '';
  $('meta').innerHTML = data.intent
    ? `intent <code>${esc(data.intent)}</code> · ${t('meta.confidence')} <code>${data.confidence}</code> · ${state.rows.length} ${t('meta.rows')}`
    : '';
  $('evidence').innerHTML = (data.evidence || []).map(e => `<li>${esc(e)}</li>`).join('');
  $('results').innerHTML = renderRows(state.rows, data.intent);
  $('sparqlOut').textContent = data.sparql || '—';
  $('cypherOut').textContent = data.cypher || '—';
  $('planOut').textContent = JSON.stringify(
    {intent: data.intent, slots: data.slots, confidence: data.confidence, evidence: data.evidence,
     graph_pattern: data.pattern}, null, 2);
  document.querySelectorAll('#results .item').forEach(el => el.onclick = () => openNode(el.dataset.id));
  if (!keepTab) showTab('answer');
}

function renderRows(rows, intent) {
  if (!rows || !rows.length) return `<p class="empty">${esc(t('results.none'))}</p>`;
  const cardIntents = ['counters', 'rules', 'describe', 'requirements', 'compare', 'zone_responsibility', 'search'];
  if (cardIntents.includes(intent)) return `<div class="cards">${rows.map(cardRow).join('')}</div>`;
  const cols = Object.keys(rows[0]).filter(c => c !== 'definition');
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = rows.map(r => '<tr>' + cols.map(c => {
    const v = r[c];
    const txt = Array.isArray(v) ? v.join(', ') : v;
    return `<td class="wrap">${esc(txt)}</td>`;
  }).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function cardRow(r) {
  const title = r.label || r.name || r.id || '';
  const kind = r.type || r.kind || r.side || r.relation || '';
  const def = r.definition || r.rationale || r.summary || '';
  const skip = new Set(['id', 'label', 'name', 'type', 'kind', 'definition', 'rationale', 'side', 'step', 'player', 'rule', 'zone', 'counter', 'assignment', 'requirement', 'relation']);
  const kv = Object.entries(r).filter(([k, v]) => !skip.has(k) && v !== '' && v != null && (!Array.isArray(v) || v.length))
    .map(([k, v]) => `<div>${esc(k)}</div><div>${esc(Array.isArray(v) ? v.join(', ') : v)}</div>`).join('');
  const id = r.id || r.step || r.player || r.rule || r.zone || r.counter || r.assignment || r.requirement || '';
  return `<div class="card"><h3>${esc(title)}</h3><div class="kind">${esc(kind)}</div>
    ${def ? `<p>${esc(def)}</p>` : ''}${kv ? `<div class="kv">${kv}</div>` : ''}
    ${id ? `<div style="margin-top:8px"><button class="ghost item" data-id="${esc(id)}">${esc(t('results.open'))} ${esc(id)}</button></div>` : ''}</div>`;
}

/* ------------------------------------------------------------------ browse */
async function browse() {
  const params = new URLSearchParams({q: $('filter').value || 'zone', limit: '60'});
  if ($('typeFilter').value) params.set('type', $('typeFilter').value);
  const data = await (await fetch('/api/search?' + params.toString())).json();
  $('browse').innerHTML = (data.rows || []).map(r =>
    `<button class="item" data-id="${esc(r.id)}"><div class="t">${esc(r.type)}</div>${esc(r.label)}</button>`).join('')
    || `<div class="empty">${esc(t('browse.nothing'))}</div>`;
  $('browse').querySelectorAll('.item').forEach(el => el.onclick = () => openNode(el.dataset.id));
}
$('filter').oninput = debounce(browse, 220);
$('typeFilter').onchange = browse;
$('ask').onclick = () => run($('q').value);
$('q').onkeydown = e => { if (e.key === 'Enter') run($('q').value); };
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ----------------------------------------------------------------- drawer */
async function openNode(id) {
  const data = await (await fetch('/api/node?id=' + encodeURIComponent(id))).json();
  if (data.error) { $('drawerBody').innerHTML = `<p class="err">${esc(data.error)}</p>`; $('drawer').classList.add('open'); return; }
  const rel = Object.entries(data.outgoing || {}).map(([p, targets]) =>
    `<div class="rel"><h4>${esc(p)}</h4>${targets.map(tg =>
      `<span class="pill" data-id="${esc(tg.id)}">${esc(tg.label)}</span>`).join('')}</div>`).join('');
  $('drawerBody').innerHTML = `
    <h3>${esc(data.label)}</h3>
    <div class="kind" style="color:var(--accent);font-size:11px;letter-spacing:.8px;text-transform:uppercase">${esc(data.type)}</div>
    <p class="meta"><code>${esc(data.id)}</code></p>
    ${data.definition ? `<p>${esc(data.definition)}</p>` : ''}
    ${data.keys && data.keys.length ? `<ul class="keys">${data.keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}
    ${rel}
    <div class="rel"><h4>${esc(t('drawer.incoming'))} (${(data.incoming || []).length})</h4>
      ${(data.incoming || []).slice(0, 30).map(i => `<span class="pill" data-id="${esc(i.id)}">${esc(i.label)} <b>${esc(i.predicate)}</b></span>`).join('')}
    </div>`;
  $('drawerBody').querySelectorAll('.pill').forEach(el => el.onclick = () => openNode(el.dataset.id));

function closeDrawer() { $('drawer').classList.remove('open'); }

/* ------------------------------------------------------------------ court */
async function loadCourt() {
  const params = new URLSearchParams({lang: LANG});
  if (state.scheme) params.set('scheme', state.scheme);
  const data = await (await fetch('/api/court?' + params.toString())).json();
  $('courtOut').textContent = data.court;
  if (state.scheme) $('courtScheme').value = state.scheme;
}
$('courtScheme').onchange = e => { state.scheme = e.target.value || null; loadCourt(); };

/* ------------------------------------------------------------------ graph */
/* Beginner-first graph explorer: animated force layout, draggable nodes,
   hover = neighbourhood spotlight, double-click = drill-down (with Back),
   family legend filters, in-graph search, zoom/fit controls, adaptive labels. */
const FAMILIES = [
  { id: 'plays',   color: '#ff7a7a', label: 'Plays & actions',     types: ['Play', 'OffensivePlay', 'DefensivePlay', 'Action', 'ActionType', 'Decision', 'Formation'] },
  { id: 'schemes', color: '#c792ea', label: 'Schemes & coverages', types: ['Scheme', 'OffensiveScheme', 'DefensiveScheme', 'Coverage', 'Assignment', 'Counter', 'Outcome', 'Situation'] },
  { id: 'zones',   color: '#5ddb92', label: 'Zones & space',       types: ['Zone', 'ZoneType'] },
  { id: 'people',  color: '#5ac8fa', label: 'Roles & people',      types: ['Position', 'PositionGroup', 'Role', 'Archetype', 'Skill', 'Player', 'Coach', 'Team'] },
  { id: 'rules',   color: '#ffe066', label: 'Rules',               types: ['Rule', 'RuleType', 'Penalty'] },
  { id: 'other',   color: '#94a3b8', label: 'Concepts',            types: ['Concept'] }
];
const familyOf = ty => (FAMILIES.find(f => f.types.includes(ty)) || FAMILIES[FAMILIES.length - 1]).id;

const NS = 'http://www.w3.org/2000/svg';
let simNodes = [], simLinks = [], linkEls = [], nodeEls = [];
let simAlpha = 0, simRaf = null, simTicks = 0, fitted = false;
let view = { k: 1, x: 0, y: 0 }, hoverId = null, familyFilter = null;
let dragNode = null, dragMoved = 0, panning = null, suppressClick = null;
let hubSet = new Set(), labelCut = 4;
state.adj = new Map(); state.focusStack = []; state.customFocus = null;

const svgEl = () => $('svg');
const svgW = () => svgEl().clientWidth || 900;
const svgH = () => svgEl().clientHeight || 520;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function applyTransform() {
  const g = svgEl().querySelector('#viewport');
  if (g) g.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  refreshLabels();
}
function toSvg(e) {
  const r = svgEl().getBoundingClientRect();
  return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
}
function zoomBy(f, cx, cy) {
  const w = svgW(), h = svgH();
  cx = cx == null ? w / 2 : cx; cy = cy == null ? h / 2 : cy;
  const k2 = clamp(view.k * f, 0.15, 4);
  view.x = cx - (cx - view.x) * (k2 / view.k);
  view.y = cy - (cy - view.y) * (k2 / view.k);
  view.k = k2; applyTransform();
}
function fitView() {
  if (!simNodes.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  simNodes.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });
  const w = svgW(), h = svgH(), pad = 40;
  const k = clamp(Math.min((w - pad * 2) / Math.max(x1 - x0, 1), (h - pad * 2) / Math.max(y1 - y0, 1)), 0.2, 1.5);
  view.k = k;
  view.x = w / 2 - k * (x0 + x1) / 2;
  view.y = h / 2 - k * (y0 + y1) / 2;
  applyTransform();
}

/* --- simulation --------------------------------------------------------- */
function startSim(alpha) {
  simAlpha = Math.max(simAlpha, alpha);
  if (!simRaf) simRaf = requestAnimationFrame(tick);
}
function tick() {
  const n = simNodes, cool = clamp(simAlpha, 0.02, 1);
  for (let i = 0; i < n.length; i++) {
    const a = n[i];
    for (let j = i + 1; j < n.length; j++) {
      const b = n[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 0.01;
      if (d2 > 62500) continue;
      const f = 900 / d2, d = Math.sqrt(d2);
      a.vx -= dx / d * f; a.vy -= dy / d * f;
      b.vx += dx / d * f; b.vy += dy / d * f;
    }
  }
  for (const l of simLinks) {
    const a = l._s, b = l._t;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const f = (d - 70) * 0.012 * cool;
    a.vx += dx / d * f; a.vy += dy / d * f;
    b.vx -= dx / d * f; b.vy -= dy / d * f;
  }
  const w = svgW(), h = svgH(), pad = 30;
  for (const v of n) {
    if (v.fx != null) { v.x = v.fx; v.y = v.fy; v.vx = v.vy = 0; continue; }
    v.vx += (w / 2 - v.x) * 0.0025; v.vy += (h / 2 - v.y) * 0.0025;
    v.x += v.vx * cool * 0.55; v.y += v.vy * cool * 0.55;
    v.x = clamp(v.x, pad, w - pad); v.y = clamp(v.y, pad, h - pad);
    v.vx *= 0.82; v.vy *= 0.82;
  }
  paint();
  simAlpha -= 0.012; simTicks++;
  if (simAlpha > 0.02 && simTicks < 400) simRaf = requestAnimationFrame(tick);
  else { simRaf = null; if (!fitted) { fitted = true; fitView(); } }
}

/* --- rendering ------------------------------------------------------------ */
function radius(n) { return 4 + Math.min(9, Math.sqrt(n.deg || 1) * 2.2); }

function refreshLabels() {
  const mode = $('graphLabels').value;
  const total = simNodes.length;
  const showAll = mode === 'on' || view.k >= 1.6 || total <= 40;
  for (const el of nodeEls) {
    const n = el.n;
    let vis;
    if (mode === 'off') vis = hoverId === n.id;
    else if (showAll) vis = true;
    else vis = n.deg >= labelCut || hubSet.has(n.id) || hoverId === n.id;
    el.tx.style.opacity = vis ? 1 : 0;
  }
}

function applyHighlight() {
  for (const el of nodeEls) {
    let dim = false;
    if (familyFilter && familyOf(el.n.type) !== familyFilter) dim = true;
    if (!dim && hoverId && el.n.id !== hoverId && !(state.adj.get(hoverId) || new Set()).has(el.n.id)) dim = true;
    el.g.classList.toggle('dim', dim);
  }
  for (let i = 0; i < linkEls.length; i++) {
    const l = simLinks[i];
    let dim = false;
    if (familyFilter && !(familyOf(l._s.type) === familyFilter && familyOf(l._t.type) === familyFilter)) dim = true;
    if (!dim && hoverId && l.source !== hoverId && l.target !== hoverId) dim = true;
    linkEls[i].classList.toggle('dim', dim);
  }
  refreshLabels();
}

function paint() {
  for (const el of nodeEls) {
    const x = el.n.x.toFixed(1), y = el.n.y.toFixed(1), r = radius(el.n);
    el.c.setAttribute('cx', x); el.c.setAttribute('cy', y); el.c.setAttribute('r', r);
    el.tx.setAttribute('x', (el.n.x + r + 3).toFixed(1)); el.tx.setAttribute('y', (el.n.y + 3).toFixed(1));
  }
  for (let i = 0; i < linkEls.length; i++) {
    const l = simLinks[i], e = linkEls[i];
    e.setAttribute('x1', l._s.x.toFixed(1)); e.setAttribute('y1', l._s.y.toFixed(1));
    e.setAttribute('x2', l._t.x.toFixed(1)); e.setAttribute('y2', l._t.y.toFixed(1));
  }
}

function draw(nodes, links) {
  const svg = svgEl();
  if (simRaf) cancelAnimationFrame(simRaf);
  simRaf = null; hoverId = null;
  const ids = new Map(nodes.map(n => [n.id, n]));
  const valid = links.filter(l => ids.has(l.source) && ids.has(l.target));

  const w = svgW(), h = svgH();
  const deg = {};
  valid.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  nodes.forEach((n, i) => {
    const a = (i / Math.max(nodes.length, 1)) * 2 * Math.PI;
    const R = Math.min(w, h) * 0.34;
    n.x = w / 2 + R * Math.cos(a); n.y = h / 2 + R * Math.sin(a);
    n.vx = 0; n.vy = 0; n.fx = null; n.fy = null; n.deg = deg[n.id] || 0;
  });
  hubSet = new Set(nodes.slice().sort((a, b) => b.deg - a.deg).slice(0, 20).map(n => n.id));
  // auto-label cut: roughly the top 12% most connected nodes stay labelled
  const degsDesc = nodes.map(n => n.deg).sort((a, b) => b - a);
  labelCut = Math.max(3, degsDesc[Math.min(degsDesc.length - 1, Math.floor(degsDesc.length * 0.12))] || 3);
  state.adj = new Map(nodes.map(n => [n.id, new Set()]));
  valid.forEach(l => { state.adj.get(l.source).add(l.target); state.adj.get(l.target).add(l.source); });

  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = '';
  const vp = document.createElementNS(NS, 'g');
  vp.setAttribute('id', 'viewport');
  svg.appendChild(vp);

  linkEls = valid.map(l => { const e = document.createElementNS(NS, 'line'); vp.appendChild(e); return e; });
  nodeEls = nodes.map(n => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('data-id', n.id);
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('fill', colorOf(n.type));
    const tx = document.createElementNS(NS, 'text');
    tx.textContent = (n.label || n.id).slice(0, 28);
    g.appendChild(c); g.appendChild(tx); vp.appendChild(g);
    return { g, c, tx, n };
  });

  nodeEls.forEach(el => {
    el.g.addEventListener('click', () => {
      if (suppressClick === el.n.id) { suppressClick = null; return; }
      openNode(el.n.id);
    });
    el.g.addEventListener('dblclick', () => drillTo(el.n.id, el.n.label));
    el.g.addEventListener('mouseenter', () => { hoverId = el.n.id; applyHighlight(); });
    el.g.addEventListener('mouseleave', () => { hoverId = null; applyHighlight(); });
    el.c.addEventListener('mousemove', ev => showTip(ev, el.n.id));
  });

  simNodes = nodes;
  simLinks = valid.map(l => ({ ...l, _s: ids.get(l.source), _t: ids.get(l.target) }));
  fitted = false; simTicks = 0; simAlpha = 0;
  view = { k: 1, x: 0, y: 0 }; applyTransform();
  startSim(1);
}

/* --- drill-down / back ------------------------------------------------------ */
function ensureFocusOption(id, label) {
  const sel = $('graphFocus');
  if (![...sel.options].some(o => o.value === id)) {
    const o = document.createElement('option');
    o.value = id; o.textContent = '\u25b8 ' + label;
    sel.appendChild(o);
  }
}
function drillTo(id, label) {
  const cur = $('graphFocus').selectedOptions[0];
  state.focusStack.push({ focus: state.focus, label: cur && cur.value ? cur.textContent.replace(/^\u25b8 /, '') : null });
  state.focus = id;
  state.customFocus = { id, label: label || id };
  ensureFocusOption(id, label || id);
  $('graphFocus').value = id;
  updateBack();
  loadGraph();
}
function goBack() {
  const prev = state.focusStack.pop();
  if (!prev) return;
  state.focus = prev.focus || null;
  if (prev.focus) { ensureFocusOption(prev.focus, prev.label || prev.focus); $('graphFocus').value = prev.focus; }
  else $('graphFocus').value = '';
  updateBack();
  loadGraph();
}
function resetView() {
  state.focus = null; state.focusStack = []; state.customFocus = null;
  $('graphFocus').value = ''; updateBack(); loadGraph();
}
function updateBack() { $('gBack').hidden = state.focusStack.length === 0; }

/* --- legend (families) -------------------------------------------------------- */
function drawLegend(counts) {
  $('graphLegend').innerHTML = FAMILIES.map(f => {
    const total = f.types.reduce((s, ty) => s + (counts[ty] || 0), 0);
    if (!total) return '';
    return `<button class="fam ${familyFilter === f.id ? 'on' : ''}" data-family="${f.id}">`
      + `<i style="background:${f.color}"></i>${esc(f.label)} <b>${total}</b></button>`;
  }).join('');
  $('graphLegend').querySelectorAll('.fam').forEach(b => b.onclick = () => {
    const f = b.dataset.family;
    familyFilter = familyFilter === f ? null : f;
    drawLegend(counts); applyHighlight();
  });
}

/* --- in-graph search ----------------------------------------------------------- */
async function graphSearch(q) {
  const box = $('graphSearchList');
  if (!q || q.length < 2) { box.style.display = 'none'; return; }
  const data = await (await fetch('/api/search?q=' + encodeURIComponent(q) + '&limit=8')).json();
  const rows = data.rows || [];
  box.innerHTML = rows.length
    ? rows.map(r => `<button data-id="${esc(r.id)}" data-label="${esc(r.label)}"><span class="t">${esc(r.type)}</span>${esc(r.label)}</button>`).join('')
    : `<button disabled>${esc(t('browse.nothing'))}</button>`;
  box.style.display = 'block';
  box.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => {
    box.style.display = 'none'; $('graphSearch').value = '';
    drillTo(b.dataset.id, b.dataset.label);
    openNode(b.dataset.id);
  });
}

/* --- controls --------------------------------------------------------------------- */
async function loadGraph() {
  const params = new URLSearchParams({ depth: $('graphDepth').value || '1' });
  if (state.focus) params.set('focus', state.focus);
  const data = await (await fetch('/api/graph?' + params.toString())).json();
  state.nodes = data.nodes || []; state.links = data.links || [];
  draw(state.nodes, state.links);
  const counts = {};
  state.nodes.forEach(n => counts[n.type] = (counts[n.type] || 0) + 1);
  $('graphInfo').textContent = `${state.nodes.length} nodes \u00b7 ${state.links.length} edges`;
  drawLegend(counts);
  applyHighlight();
}
$('graphFocus').onchange = e => { state.focus = e.target.value || null; state.focusStack = []; state.customFocus = null; updateBack(); loadGraph(); };
$('graphDepth').onchange = loadGraph;
$('graphLabels').onchange = refreshLabels;
$('gzIn').onclick = () => zoomBy(1.25);
$('gzOut').onclick = () => zoomBy(1 / 1.25);
$('gFit').onclick = () => fitView();
$('gReset').onclick = resetView;
$('gBack').onclick = goBack;

let searchTimer = null;
$('graphSearch').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => graphSearch($('graphSearch').value.trim()), 220); };
$('graphSearch').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(searchTimer); graphSearch($('graphSearch').value.trim()); } };
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('.gsearch')) $('graphSearchList').style.display = 'none';
});

/* --- pan / zoom / node dragging ------------------------------------------------------ */
(function enableGraphMouse() {
  const svg = svgEl();
  svg.addEventListener('mousedown', e => {
    const g = e.target.closest ? e.target.closest('g.node') : null;
    if (g) {
      dragNode = simNodes.find(n => n.id === g.getAttribute('data-id')) || null;
      dragMoved = 0;
      e.preventDefault();
    } else {
      panning = { x: e.clientX, y: e.clientY };
      svg.style.cursor = 'grabbing';
    }
  });
  window.addEventListener('mousemove', e => {
    if (dragNode) {
      const pt = toSvg(e);
      if (Math.abs(pt.x - dragNode.x) > 1 || Math.abs(pt.y - dragNode.y) > 1) dragMoved++;
      dragNode.fx = pt.x; dragNode.fy = pt.y;
      startSim(0.3);
    } else if (panning) {
      view.x += e.clientX - panning.x; view.y += e.clientY - panning.y;
      panning = { x: e.clientX, y: e.clientY };
      applyTransform();
    }
  });
  window.addEventListener('mouseup', () => {
    if (dragNode) {
      if (dragMoved > 3) suppressClick = dragNode.id;
      dragNode.fx = dragNode.fy = null; dragNode = null;
      startSim(0.25);
    }
    panning = null; svg.style.cursor = 'grab';
  });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  window.addEventListener('resize', () => { if (fitted) fitView(); });
})();

/* --- tooltip -------------------------------------------------------------------------- */
let tip = null;
function showTip(ev, id) {
  const n = state.nodes.find(x => x.id === id);
  if (!n) return;
  if (!tip) {
    tip = document.createElement('div');
    tip.style.cssText =
      'position:fixed;background:#0b1018;border:1px solid #2a3548;border-radius:8px;padding:6px 9px;font-size:12px;z-index:60;pointer-events:none;max-width:280px';
    document.body.appendChild(tip);
  }
  tip.innerHTML = `<b>${esc(n.label || n.id)}</b><br><span style="color:#94a3b8">${esc(n.type)}</span><br>${esc((n.definition || '').slice(0, 140))}`;
  tip.style.left = (ev.clientX + 14) + 'px';
  tip.style.top = (ev.clientY + 14) + 'px';
}
document.addEventListener('mousemove', e => { if (tip && e.target.tagName !== 'circle') tip.remove(), tip = null; });

boot().catch(e => { $('summary').innerHTML = `<span class="err">${esc(e.message)}</span>`; });
</script>
</body>
