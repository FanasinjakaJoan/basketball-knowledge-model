name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate the knowledge graph
        run: python -m basketball_kg.cli validate

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Generated artefacts are up to date
        run: |
          python scripts/gen_queries.py --check
          python scripts/gen_ontology_docs.py --check

      - name: Every published SPARQL example runs
        run: |
          for f in queries/sparql/*.rq; do
            echo "== $f"
            python -m basketball_kg.cli sparql --file "$f" > /dev/null
          done

      - name: Smoke-test the CLI surface
        run: |
          python -m basketball_kg.cli stats
          python -m basketball_kg.cli court --scheme scheme:zone-2-3
          python -m basketball_kg.cli ask "how do you attack a 2-3 zone?"
          python -m basketball_kg.cli ask "who covers the corner in a 2-3 zone?" -f sparql
          python -m basketball_kg.cli export -f dot --focus play:pick-and-roll
          python -m basketball_kg.cli export -f jsonld | head -20
